<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>My To-Do List</title>
</head>
<body>
    <div class="background-glow"></div>

    <div class="app-container"></div>
       <!--Hero Section-->>
        <header class="top-pills">
            <button class="pill-btn add-main" id="openAddModal"><i class="fa-solid fa-plus"></i></button>
            <button class="pill-btn">Infinite List</button>
            <button class=" pill-btn active"> Focus & Break Pomo Timer</button>
            <button class="pill-btn">Saves Progress</button>
            <button class="pill-btn" id="openCommands">Commands</button>
        </header>

        <!--Main Title Section-->
        <div class="title-section">
            <span class="subtitle">Minimal </span>
            <div class="main-title-wrapper">
                <h1>tasklist<h1>
                <div class="title-decoration">
                  <div class="chat-bubble-icon"><i class="fa-solid fa-comment"></i></div>
                   <div class="dots-badge"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                </div>
           </div>
        </div>
    
    

        <!-- Dashboard Grid Layout-->
        <div class="dashboard-grid">
            <!--Left Coloumn: Timer and Chat TO-DO-->
            <div class="column-left">
                <!--Timer Card-->
                <div class="glass-card timer-card"></div>
                    <div class="timer-display" id="timerDisplay"> 00'00</div>
                    <div class="timer-controls">
                        <button class="timer-btn" id="timerToggle"><i class="fa-solid fa-solid"> </i></button>
                        <button class="timer-btn" id="timerReset"><i class="fa-solid fa-pause"></i></button>
                    </div>
                    <div class="timer-dots">
                        <span class="pomo-dot" active></span>
                        <span class="pomo-dot" active></span>
                        <span class="pomo-dot" active></span>
                        <span class="pomo-dot" active></span>
                        <span class="pomo-dot"></span>
                        <span class="pomo-dot"></span>
                        <span class="pomo-dot"></span>
                        <span class="pomo-dot"></span>
                    </div>
               </div>

                <!-- Chat To-Do Card-->
                <div class="glass-card task-card">
                    <div class="card-header">
                        <div class="header title">
                            <span class="dots-icon"><i class="fa-solid fa-ellipsis-vertical"></i></span>
                            <h2>CHAT TO-DO</h2>
                        </div>
                        <span class="badge-count" id="chatCount">0</span>
                    </div>

                    <div class="task-list" id="chatTaskList">
                        <!--Populated via JS-->
                    </div>

                    <div class="card-footer">
                        <div class="progress-bar-container"></div>
                           <div class="progress-fill" id="chatProgressFill" style="width: 0%;"></div>
                        </div>
                        <div class="progress-stats">
                            <span id="chatStatsText">0 OF 0</span>
                            <span id="chatsStatsPercent">0%</span>
                        </div>
                    </div>
            </div>
        </div>


        <!-- Right Column: Today Tasks -->

        <div class="column-right">
            <div class="glass-card task-card large-task-card">
                <div class="card-header">
                    <div class="header-title">
                        <span class="dots-icon"><i class="fa-solid fa-ellipsis-vertical"></i></span>
                        <h2>TODAYS TASK</h2>
                    </div>
                </div>

                <div class="task-list" id="todaysTaskList">
                    <!--Populated via JS-->
                </div>
                <div class="card-footer">
                    <div class="progress-bar-container">
                        <div class="progress-fill" id="todayProghressFill" style="width: 0%;"></div>
                     </div>
                        <div class="progress-stats">
                            <span id="todayStats"> 0 OF 0</span>
                            <span id="todayStats">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
   
 <!-- Modal for Adding Tasks-->
    <div class="modal-overlay" id="addTaskModal">
        <div class="modal-content glass-card">
            <h3>Add New Task</h3>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskInput">Task Description</label>
                    <input type="text" id="taskInput" placeholder="e.g review stream layout..." required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="taskCategory">Select List</label>
                    <select id="taskCategory">
                        <option value="today">Today Task</option>
                        <option value="chat"> Chat To-Do</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="closeAddModal">Cancel</button>
                    <button type="submit" class="btn-primary">Add task</button>
                </div>
            </form>
        </div>
    </div>
    '
    <!--Modal for Commands-->
    <div class="modal-overlay" id="commandsModal">
        <div class="modal-content glass-card">
            <h3>Quick Commands</h3>
            <div class="command-list">
                <button class="command-btn" id="cmdResetTasks"><i class="fa-solid fa-rotate-right"></i>Clear All Task</button>
                <button class="command-btn" id="cmdClearCompleted"><i class=" fa-solid fa-trash-can">Clear Completed Task</i></button>
                <button class="command-btn" id="cmdExport"><i class="fa-solid fa-download"></i>Export Progress Data</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="closeCommands">Close</button>
            </div>
        </div>
    </div>    
    <script src="index.js"></script>
</body>
</html>
